spring.application.name=demo

# Bind server to all network interfaces (allows local Wi-Fi / LAN and external connections)
server.address=0.0.0.0
server.port=8080

# Fallback base URL for URL Shortener responses
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Database Configuration (MySQL Local Server)
spring.datasource.url=jdbc:mysql://localhost:3306/url_shortener_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
